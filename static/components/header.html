<!-- Header -->
<link rel="stylesheet" href="components/header.css">
<header class="header">
    <div class="header-content">
        <h1><img src="https://src.hex2077.dev/logo/favicon.ico" class="header-logo" alt="Logo"> <span class="header-title" data-i18n="header.title">AIClient2API 管理控制台</span></h1>
        <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Menu" title="Menu" data-i18n-title="common.menu">
            <i class="fas fa-bars"></i>
        </button>
        <div class="header-controls" id="headerControls">
            <a href="https://a001.hex2077.dev/" target="_blank" class="kiro-buy-link" title="Store" data-i18n-title="header.store">
                <i class="fas fa-shopping-cart"></i> <span data-i18n="header.store">Store</span>
            </a>
            <a href="https://space.bilibili.com/3546828630919792/upload/video" target="_blank" class="kiro-video-link" title="Tutorials" data-i18n-title="header.videoTutorial">
                <i class="fas fa-video"></i> <span data-i18n="header.videoTutorial">Tutorials</span>
            </a>
            <span class="status-badge" id="serverStatus">
                <i class="fas fa-circle"></i> <span class="status-text" data-i18n="header.status.connecting">Connecting...</span>
            </span>
            <a href="https://github.com/justlovemaki/AIClient-2-API" target="_blank" rel="noopener noreferrer" class="github-link" title="GitHub" data-i18n-title="header.github">
                <i class="fab fa-github"></i>
            </a>
            <button id="themeToggleBtn" class="theme-toggle" aria-label="Toggle Theme" data-i18n-aria-label="header.themeToggle" title="Toggle Theme" data-i18n-title="header.themeToggle">
                <i class="fas fa-moon"></i>
                <i class="fas fa-sun"></i>
            </button>
            <button id="logoutBtn" class="logout-btn" data-i18n="header.logout" title="Logout" data-i18n-title="header.logout">
                <i class="fas fa-sign-out-alt"></i> <span data-i18n="header.logout">Logout</span>
            </button>
            <button id="restartBtn" class="logout-btn" aria-label="Restart Service" data-i18n-aria-label="header.restart">
                <i id="restartBtnIcon" class="fas fa-redo"></i> <span id="restartBtnText" class="btn-text" data-i18n="header.restart">Restart</span>
            </button>
        </div>
    </div>
</header>
